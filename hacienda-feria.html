<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Darwash · Feria en Vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FAFAF7;--surface:#FFFFFF;--surface-2:#F5F4EE;
      --border:#E5E5E0;--border-strong:#D4D2C8;
      --text:#1A1A1A;--text-2:#4A4A48;--muted:#8A8880;
      --cyan:#00B5B6;--cyan-soft:#E6F8F8;
      --green:#00A86B;--green-soft:#E6F7EF;
      --amber:#B8881F;--amber-soft:#FBF3DC;
      --red:#D63B47;--red-soft:#FCE8EA;
      --blue:#2E7AC7;--blue-soft:#E8F0FA;
      --serif:'Lora',Georgia,serif;
      --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
      --mono:'JetBrains Mono',Consolas,Monaco,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh;overscroll-behavior:none;}

    .lf-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
    .lf-logo{width:36px;height:36px;border-radius:8px;background:var(--cyan);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:13px;letter-spacing:.5px;flex-shrink:0;}
    .lf-wordmark-wrap{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0;}
    .lf-wordmark{font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:1.2px;color:var(--text);}
    .lf-wordmark-sub{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
    .lf-badge{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:1.5px;padding:4px 10px;border-radius:4px;border:1px solid;text-transform:uppercase;flex-shrink:0;color:var(--cyan);border-color:var(--cyan);background:var(--cyan-soft);}

    .lf-main{padding:16px 16px 100px;max-width:520px;margin:0 auto;}

    .lf-section-label{font-family:var(--mono);font-weight:600;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:24px 0 10px;display:flex;align-items:center;gap:8px;}
    .lf-section-label::after{content:"";flex:1;height:1px;background:var(--border);}
    .lf-section-label:first-of-type{margin-top:8px;}

    .lf-field{margin-bottom:10px;}
    .lf-field-label{font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;display:block;}
    .lf-input,.lf-textarea,.lf-select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:11px 12px;color:var(--text);font-family:var(--sans);font-size:15px;outline:none;transition:border-color 150ms,background 150ms;-webkit-appearance:none;appearance:none;}
    .lf-input:focus,.lf-textarea:focus,.lf-select:focus{border-color:var(--cyan);background:#FCFCFA;}
    .lf-input::placeholder,.lf-textarea::placeholder{color:var(--border-strong);}
    .lf-textarea{resize:none;min-height:80px;}
    .lf-select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path fill='%238A8880' d='M6 8L2 4h8z'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:10px;padding-right:32px;}

    .lf-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .lf-row-2 .lf-field{margin-bottom:0;}

    /* AUTOCOMPLETE PRODUCTOR */
    .prod-autocomplete-wrap{position:relative;}
    .prod-suggestions{display:none;position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,0.08);max-height:260px;overflow-y:auto;z-index:20;}
    .prod-suggestions.show{display:block;}
    .prod-suggestion-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);}
    .prod-suggestion-item:last-child{border-bottom:none;}
    .prod-suggestion-item:hover{background:var(--cyan-soft);}
    .prod-suggestion-name{font-family:var(--sans);font-size:14px;color:var(--text);font-weight:500;line-height:1.3;}
    .prod-suggestion-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:0.3px;margin-top:3px;}

    /* SEGMENT TIPO */
    .tipo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .tipo-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color 150ms,background 150ms;}
    .tipo-card.active{border-color:var(--cyan);background:var(--cyan-soft);}
    .tipo-icon{font-size:22px;line-height:1;}
    .tipo-label{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:1.2px;color:var(--text-2);text-transform:uppercase;}
    .tipo-card.active .tipo-label{color:var(--cyan);}

    /* TROPA INFO CARD — modo interno/salida (readonly) */
    .tropa-info-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:6px;padding:14px 16px;}
    .tropa-info-card.mode-salida{border-left-color:var(--amber);}
    .tropa-info-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
    .tropa-info-codigo{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--text);letter-spacing:0.5px;}
    .tropa-info-mode{font-family:var(--mono);font-weight:600;font-size:9px;letter-spacing:1.5px;padding:3px 8px;border-radius:4px;border:1px solid;text-transform:uppercase;}
    .tropa-info-mode.mode-interno{color:var(--cyan);border-color:var(--cyan);background:var(--cyan-soft);}
    .tropa-info-mode.mode-salida{color:var(--amber);border-color:var(--amber);background:var(--amber-soft);}
    .tropa-info-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;font-size:13px;}
    .tropa-info-row:last-child{margin-bottom:0;}
    .tropa-info-lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;flex-shrink:0;}
    .tropa-info-val{font-family:var(--sans);color:var(--text);text-align:right;word-break:break-word;}

    .lf-btn{width:100%;border:1px solid transparent;border-radius:6px;padding:14px 16px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity 150ms;}
    .lf-btn:active{opacity:0.85;}
    .lf-btn:disabled{opacity:0.5;cursor:not-allowed;}
    .btn-save{background:var(--cyan);color:#fff;border-color:var(--cyan);margin-top:24px;}
    .btn-save.salida{background:var(--amber);border-color:var(--amber);}
    .btn-nuevo{background:transparent;border-color:var(--blue);color:var(--blue);}
    .btn-volver{background:transparent;border-color:var(--border-strong);color:var(--text-2);}

    /* SUCCESS OVERLAY */
    .success-overlay{display:none;position:fixed;inset:0;background:rgba(250,250,247,0.96);z-index:100;align-items:center;justify-content:center;padding:32px 24px;}
    .success-overlay.show{display:flex;}
    .success-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:6px;padding:32px 24px;text-align:center;max-width:380px;width:100%;}
    .success-icon{width:56px;height:56px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:28px;margin:0 auto 14px;}
    .success-title{font-family:var(--serif);font-weight:600;font-size:22px;color:var(--text);margin-bottom:6px;}
    .success-sub{font-family:var(--sans);font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5;}
    .success-code{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:8px 12px;margin-bottom:18px;letter-spacing:0.5px;}
    .btn-group{display:flex;flex-direction:column;gap:8px;}

    .user-pill{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--muted);letter-spacing:0.5px;}
  </style>
</head>
<body>

<div class="lf-header">
  <div class="lf-logo">DRW</div>
  <div class="lf-wordmark-wrap">
    <span class="lf-wordmark">DARWASH</span>
    <span class="lf-wordmark-sub" id="header-sub">FERIA EN VIVO</span>
  </div>
  <span class="lf-badge" id="header-badge">Movimiento</span>
</div>

<div class="lf-main" id="lf-main">

  <div class="lf-section-label">Tipo de movimiento</div>
  <div class="tipo-grid" id="tipo-grid">
    <div class="tipo-card active" data-tipo="entrada">
      <div class="tipo-icon">⬇️</div>
      <div class="tipo-label">Entrada</div>
    </div>
    <div class="tipo-card" data-tipo="interno">
      <div class="tipo-icon">↔️</div>
      <div class="tipo-label">Interno</div>
    </div>
    <div class="tipo-card" data-tipo="salida">
      <div class="tipo-icon">⬆️</div>
      <div class="tipo-label">Salida</div>
    </div>
  </div>

  <div class="lf-section-label">Cliente / Propietario</div>
  <div class="lf-field">
    <div class="prod-autocomplete-wrap">
      <input class="lf-input" id="empresa" type="text" placeholder="Buscar productor o establecimiento…" autocorrect="off" autocomplete="off"/>
      <div class="prod-suggestions" id="prod-suggestions"></div>
    </div>
  </div>

  <div class="lf-section-label">Detalle de hacienda</div>
  <div class="lf-row-2">
    <div class="lf-field">
      <label class="lf-field-label">Categoría</label>
      <select class="lf-select" id="categoria">
        <option value="Novillo">Novillo</option>
        <option value="Vaquillona">Vaquillona</option>
        <option value="Vaca">Vaca</option>
        <option value="Ternero">Ternero</option>
        <option value="Ternera">Ternera</option>
        <option value="Toro">Toro</option>
        <option value="Torito/MEJ">Torito/MEJ</option>
      </select>
    </div>
    <div class="lf-field">
      <label class="lf-field-label">Cabezas</label>
      <input class="lf-input" id="cabezas" type="number" min="0" inputmode="numeric" placeholder="0"/>
    </div>
  </div>
  <div class="lf-field">
    <label class="lf-field-label">Detalle del lote (opcional)</label>
    <input class="lf-input" id="detalle-lote" type="text" placeholder="Ej: vacas gordas, novillos holando…" autocorrect="off"/>
  </div>

  <div class="lf-section-label">Ubicación</div>
  <div class="lf-field">
    <label class="lf-field-label" id="lbl-procedencia">Procedencia (campo de origen)</label>
    <input class="lf-input" id="procedencia" type="text" placeholder="Establecimiento de origen" autocorrect="off"/>
  </div>
  <div class="lf-field">
    <label class="lf-field-label" id="lbl-destino">Corral destino</label>
    <input class="lf-input" id="corral-destino" type="text" placeholder="Ej: 42" autocorrect="off"/>
  </div>

  <div class="lf-section-label">Observaciones</div>
  <div class="lf-field">
    <textarea class="lf-textarea" id="obs" placeholder="Notas, peso aproximado, incidencias…"></textarea>
  </div>

  <button class="lf-btn btn-save" id="btn-save">Registrar movimiento</button>
  <a href="index.html" class="lf-btn btn-volver" style="margin-top:8px;">← Volver al tablero</a>

  <div style="text-align:center;margin-top:16px;"><span class="user-pill" id="user-pill"></span></div>
</div>

<div class="success-overlay" id="success-overlay">
  <div class="success-card">
    <div class="success-icon">✓</div>
    <div class="success-title" id="success-title">¡Movimiento registrado!</div>
    <div class="success-sub" id="success-sub"></div>
    <div class="success-code" id="success-code"></div>
    <div class="btn-group">
      <button class="lf-btn btn-nuevo" id="btn-nuevo">+ Nuevo movimiento</button>
      <a href="index.html" class="lf-btn btn-volver">← Volver al tablero</a>
    </div>
  </div>
</div>

<script>
const SB_URL='https://qkrrumlbvspbxjoxvxho.supabase.co';
const SB_KEY='sb_publishable_ZKjsxf9lkh4tgkhAayDvbA_6DOE7E6d';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizaTxt(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}

let padronClientes=[],clienteSeleccionado=null;

async function cargarPadronClientes(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/remate_clientes?select=razon_social,cuit,id_cuenta_auxi,localidad&limit=10000`,{
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(Array.isArray(data)){
      padronClientes=data.filter(c=>c&&c.razon_social).map(c=>({
        razon_social:c.razon_social,
        cuit:c.cuit||null,
        id_cuenta_auxi:c.id_cuenta_auxi||null,
        localidad:c.localidad||'',
        _norm:normalizaTxt(c.razon_social)
      }));
      console.log('[PADRÓN] Cargados',padronClientes.length,'clientes');
    }
  }catch(e){
    console.warn('[PADRÓN] No se pudo cargar — el form sigue como texto libre:',e);
  }
}

function initProductorAutocomplete(){
  const inp=document.getElementById('empresa');
  const sug=document.getElementById('prod-suggestions');
  if(!inp||!sug) return;
  function ocultar(){sug.classList.remove('show');sug.innerHTML='';}
  function render(items){
    if(!items.length){ocultar();return;}
    sug.innerHTML=items.map((c,i)=>{
      const meta=[c.localidad||'',c.cuit||''].filter(Boolean).join(' · ')||'—';
      return `<div class="prod-suggestion-item" data-idx="${i}">
        <div class="prod-suggestion-name">${esc(c.razon_social)}</div>
        <div class="prod-suggestion-meta">${esc(meta)}</div>
      </div>`;
    }).join('');
    sug.classList.add('show');
    sug.querySelectorAll('.prod-suggestion-item').forEach(el=>{
      // mousedown dispara antes que blur del input — así el click sobrevive
      el.addEventListener('mousedown',function(e){
        e.preventDefault();
        const c=items[Number(el.dataset.idx)];
        clienteSeleccionado=c;
        inp.value=c.razon_social;
        ocultar();
      });
    });
  }
  inp.addEventListener('input',function(){
    // Si el texto ya no coincide exacto con el cliente elegido, soltar la selección.
    // Resultado: cuit/id_cuenta_auxi vuelven a null en el INSERT.
    if(clienteSeleccionado&&inp.value!==clienteSeleccionado.razon_social){
      clienteSeleccionado=null;
    }
    const q=normalizaTxt(inp.value.trim());
    if(q.length<2||!padronClientes.length){ocultar();return;}
    const matches=padronClientes.filter(c=>c._norm.includes(q)).slice(0,8);
    render(matches);
  });
  inp.addEventListener('blur',function(){setTimeout(ocultar,150);});
  inp.addEventListener('keydown',function(e){if(e.key==='Escape')ocultar();});
}

function getSession(){
  try{
    const raw=localStorage.getItem('dw_session');
    if(!raw) return null;
    const s=JSON.parse(raw);
    if(!s || !s.exp || s.exp < Date.now()) return null;
    return s;
  }catch(_){return null;}
}
const session=getSession();
if(!session){
  alert('Sesión expirada. Volvé a iniciar sesión.');
  location.href='index.html';
}
document.getElementById('user-pill').textContent='👤 '+(session?.nombre||session?.email||'—');

async function sbInsert(tabla,data){
  const res=await fetch(SB_URL+'/rest/v1/'+tabla,{
    method:'POST',
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json',
      'Prefer':'return=representation'
    },
    body:JSON.stringify(data)
  });
  if(!res.ok){
    const err=await res.text();
    throw new Error(tabla+' ['+res.status+']: '+err);
  }
  const json=await res.json();
  return Array.isArray(json)?json[0]:json;
}

async function sbPatch(tabla,query,data){
  const res=await fetch(SB_URL+'/rest/v1/'+tabla+'?'+query,{
    method:'PATCH',
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json',
      'Prefer':'return=minimal'
    },
    body:JSON.stringify(data)
  });
  if(!res.ok){
    const err=await res.text();
    throw new Error('PATCH '+tabla+' ['+res.status+']: '+err);
  }
}

async function sbGet(tabla,query){
  const res=await fetch(SB_URL+'/rest/v1/'+tabla+'?'+query,{
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}
  });
  if(!res.ok) throw new Error(tabla+' ['+res.status+']');
  return await res.json();
}

// ============================================================
// ROUTING — decide modo según URL params
// ============================================================
const params=new URLSearchParams(location.search);
const modoParam=params.get('modo');
const tropaIdParam=params.get('tropa_id');
const corralOrigenParam=params.get('corral_origen');

if(modoParam==='interno' || modoParam==='salida'){
  initReadonlyMode(modoParam, tropaIdParam, corralOrigenParam);
} else {
  initEntradaMode();
}

// ============================================================
// MODO ENTRADA — crea tropa nueva + movimiento extraferia_entrada
// ============================================================
function initEntradaMode(){
  let tipo='entrada';

  cargarPadronClientes();
  initProductorAutocomplete();

  document.querySelectorAll('.tipo-card').forEach(card=>{
    card.onclick=()=>{
      document.querySelectorAll('.tipo-card').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
      tipo=card.dataset.tipo;
      actualizarLabels(tipo);
    };
  });

  function actualizarLabels(tipo){
    const lblProc=document.getElementById('lbl-procedencia');
    const lblDest=document.getElementById('lbl-destino');
    const inpProc=document.getElementById('procedencia');
    const inpDest=document.getElementById('corral-destino');
    if(tipo==='entrada'){
      lblProc.textContent='Procedencia (campo de origen)';
      inpProc.placeholder='Establecimiento de origen';
      lblDest.textContent='Corral destino';
      inpDest.placeholder='Ej: 42';
    } else if(tipo==='interno'){
      lblProc.textContent='Corral origen';
      inpProc.placeholder='Ej: 42';
      lblDest.textContent='Corral destino';
      inpDest.placeholder='Ej: 67';
    } else {
      lblProc.textContent='Corral origen';
      inpProc.placeholder='Ej: 42';
      lblDest.textContent='Destino (frigorífico, campo, etc.)';
      inpDest.placeholder='Nombre del destino';
    }
  }

  function genCodigoTropa(){
    const d=new Date();
    const stamp=d.getFullYear().toString().slice(-2)
      +String(d.getMonth()+1).padStart(2,'0')
      +String(d.getDate()).padStart(2,'0')
      +String(d.getHours()).padStart(2,'0')
      +String(d.getMinutes()).padStart(2,'0');
    const rand=Math.floor(Math.random()*1000).toString().padStart(3,'0');
    return 'EXT-'+stamp+'-'+rand;
  }

  const TIPO_MOV_MAP={
    entrada:'extraferia_entrada',
    interno:'movimiento_interno',
    salida:'extraferia_salida'
  };

  async function guardar(){
    const empresa=document.getElementById('empresa').value.trim();
    const categoria=document.getElementById('categoria').value;
    const cabezas=parseInt(document.getElementById('cabezas').value||'0',10);
    const procedencia=document.getElementById('procedencia').value.trim();
    const corralDestino=document.getElementById('corral-destino').value.trim();
    const obs=document.getElementById('obs').value.trim();

    if(!empresa){alert('Cargá la empresa/propietario.');return;}
    if(!cabezas||cabezas<=0){alert('Cargá la cantidad de cabezas.');return;}
    if(tipo==='entrada' && !corralDestino){alert('Indicá el corral destino.');return;}
    if(tipo==='interno' && (!procedencia||!corralDestino)){alert('Indicá corral origen y destino.');return;}
    if(tipo==='salida' && !procedencia){alert('Indicá el corral origen.');return;}

    const btn=document.getElementById('btn-save');
    btn.disabled=true;btn.textContent='Guardando…';

    try{
      const codigoTropa=genCodigoTropa();
      const usuario=session?.email||null;

      const tropa=await sbInsert('tropas',{
        codigo_tropa:codigoTropa,
        propietario:empresa,
        empresa:(clienteSeleccionado&&clienteSeleccionado.razon_social)||empresa,
        id_cuenta_auxi:(clienteSeleccionado&&clienteSeleccionado.id_cuenta_auxi)||null,
        cuit:(clienteSeleccionado&&clienteSeleccionado.cuit)||null,
        detalle_lote:document.getElementById('detalle-lote').value.trim()||null,
        tipo_origen:'extraferia',
        remate_codigo:null,
        categoria:categoria,
        cabezas_inicial:cabezas,
        observaciones:obs||null,
        usuario:usuario,
        estado: tipo==='salida' ? 'cerrada' : 'activa'
      });

      await sbInsert('movimientos_corral',{
        tropa_id:tropa.id,
        corral_origen:procedencia||null,
        corral_destino:corralDestino||null,
        cabezas:cabezas,
        tipo_movimiento:TIPO_MOV_MAP[tipo],
        peso_kg:null,
        usuario:usuario,
        observaciones:obs||null
      });

      const tipoTxt={entrada:'Entrada',interno:'Movimiento interno',salida:'Salida'}[tipo];
      document.getElementById('success-sub').textContent=
        tipoTxt+' · '+cabezas+' '+(cabezas===1?'cabeza':'cabezas')+' · '+categoria+'\n'+empresa;
      document.getElementById('success-code').textContent=codigoTropa;
      document.getElementById('success-overlay').classList.add('show');
    }catch(e){
      console.error(e);
      alert('Error al guardar: '+e.message);
    }finally{
      btn.disabled=false;btn.textContent='Registrar movimiento';
    }
  }

  function nuevoMovimiento(){
    document.getElementById('empresa').value='';
    document.getElementById('cabezas').value='';
    document.getElementById('procedencia').value='';
    document.getElementById('corral-destino').value='';
    document.getElementById('obs').value='';
    const dl=document.getElementById('detalle-lote');
    if(dl) dl.value='';
    clienteSeleccionado=null;
    document.getElementById('success-overlay').classList.remove('show');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  document.getElementById('btn-save').onclick=guardar;
  document.getElementById('btn-nuevo').onclick=nuevoMovimiento;
  actualizarLabels(tipo);
}

// ============================================================
// MODO INTERNO / SALIDA — usa tropa existente, no crea ninguna
// ============================================================
async function initReadonlyMode(modo, tropaId, corralOrigen){
  if(!tropaId){
    alert('Falta tropa_id en la URL.');
    location.href='index.html';
    return;
  }

  let tropa;
  try{
    const arr=await sbGet('tropas','id=eq.'+encodeURIComponent(tropaId)+'&select=*');
    tropa=arr[0];
    if(!tropa) throw new Error('Tropa no encontrada');
  }catch(e){
    alert('Error cargando la tropa: '+e.message);
    location.href='index.html';
    return;
  }

  // Header
  const badge=document.getElementById('header-badge');
  const sub=document.getElementById('header-sub');
  if(modo==='interno'){
    badge.textContent='Mover corral';
    sub.textContent='MOVIMIENTO INTERNO';
  } else {
    badge.textContent='Sacar de feria';
    badge.style.color='var(--amber)';
    badge.style.borderColor='var(--amber)';
    badge.style.background='var(--amber-soft)';
    sub.textContent='SALIDA DE FERIA';
  }

  // Rebuild .lf-main para readonly mode
  const destLabel=modo==='interno'?'Corral destino':'Destino (frigorífico, campo, etc.)';
  const destPlaceholder=modo==='interno'?'Ej: 67':'Frigorífico XYZ, campo, feedlot…';
  const btnText=modo==='interno'?'Confirmar movimiento':'Confirmar salida';
  const btnClass=modo==='salida'?'btn-save salida':'btn-save';

  const main=document.getElementById('lf-main');
  main.innerHTML=
    '<div class="lf-section-label">Tropa</div>'
    +'<div class="tropa-info-card mode-'+esc(modo)+'">'
      +'<div class="tropa-info-head">'
        +'<span class="tropa-info-codigo">'+esc(tropa.codigo_tropa||'—')+'</span>'
        +'<span class="tropa-info-mode mode-'+esc(modo)+'">'+(modo==='interno'?'Interno':'Salida')+'</span>'
      +'</div>'
      +'<div class="tropa-info-row"><span class="tropa-info-lbl">Empresa</span><span class="tropa-info-val">'+esc(tropa.empresa||tropa.propietario||'—')+'</span></div>'
      +'<div class="tropa-info-row"><span class="tropa-info-lbl">Categoría</span><span class="tropa-info-val">'+esc(tropa.categoria||'—')+' · '+esc(tropa.cabezas_inicial)+' cab</span></div>'
      +'<div class="tropa-info-row"><span class="tropa-info-lbl">Corral origen</span><span class="tropa-info-val">'+esc(corralOrigen||'—')+'</span></div>'
    +'</div>'
    +'<div class="lf-section-label">'+esc(destLabel)+'</div>'
    +'<div class="lf-field">'
      +'<input class="lf-input" id="destino" type="text" placeholder="'+esc(destPlaceholder)+'" autocorrect="off" autocomplete="off"/>'
    +'</div>'
    +'<div class="lf-section-label">Observaciones</div>'
    +'<div class="lf-field">'
      +'<textarea class="lf-textarea" id="obs" placeholder="Notas, incidencias…"></textarea>'
    +'</div>'
    +'<button class="lf-btn '+btnClass+'" id="btn-save">'+esc(btnText)+'</button>'
    +'<a href="index.html" class="lf-btn btn-volver" style="margin-top:8px;">← Volver al tablero</a>'
    +'<div style="text-align:center;margin-top:16px;"><span class="user-pill">👤 '+esc(session?.nombre||session?.email||'—')+'</span></div>';

  // Success overlay: ajustar
  document.getElementById('success-title').textContent=
    modo==='interno'?'¡Movimiento registrado!':'¡Salida confirmada!';
  const nuevoBtn=document.getElementById('btn-nuevo');
  if(nuevoBtn) nuevoBtn.remove(); // no "nuevo movimiento" desde estos modos

  document.getElementById('btn-save').onclick=()=>guardarExistente(modo,tropa,corralOrigen);
  document.getElementById('destino').focus();
}

async function guardarExistente(modo, tropa, corralOrigen){
  const destino=document.getElementById('destino').value.trim();
  const obs=document.getElementById('obs').value.trim();

  if(!destino){
    alert(modo==='interno'?'Indicá el corral destino.':'Indicá el destino.');
    return;
  }

  const btn=document.getElementById('btn-save');
  const originalLabel=btn.textContent;
  btn.disabled=true;
  btn.textContent='Guardando…';

  try{
    const usuario=session?.email||null;
    const cabezas=parseInt(tropa.cabezas_inicial,10)||0;
    const tipoMov=modo==='interno'?'movimiento_interno':'extraferia_salida';

    await sbInsert('movimientos_corral',{
      tropa_id:tropa.id,
      corral_origen:corralOrigen,
      corral_destino:destino,
      cabezas,
      tipo_movimiento:tipoMov,
      peso_kg:null,
      usuario,
      observaciones:obs||null
    });

    if(modo==='salida'){
      await sbPatch('tropas','id=eq.'+encodeURIComponent(tropa.id),{estado:'cerrada'});
    }

    const subText=modo==='interno'
      ?'Tropa movida del corral '+corralOrigen+' al '+destino
      :'Tropa salió de feria → "'+destino+'"';
    document.getElementById('success-sub').textContent=subText;
    document.getElementById('success-code').textContent=tropa.codigo_tropa||'';
    document.getElementById('success-overlay').classList.add('show');
  }catch(e){
    console.error(e);
    alert('Error al guardar: '+e.message);
  }finally{
    btn.disabled=false;
    btn.textContent=originalLabel;
  }
}
</script>
