<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0"/>
  <title>Darwash · Croquis Feria en Vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f172a;                /* slate-900 */
      --surface:#1e293b;           /* slate-800 */
      --surface-2:#0b1220;         /* darker than bg para grid container */
      --border:#334155;            /* slate-700 */
      --border-strong:#475569;     /* slate-600 */
      --text:#f1f5f9;              /* slate-100 */
      --text-2:#cbd5e1;            /* slate-300 */
      --muted:#94a3b8;             /* slate-400 */
      --teal:#14b8a6;              /* teal-500 accent */
      --teal-soft:rgba(20,184,166,0.15);
      --red:#ef4444;
      --red-soft:rgba(239,68,68,0.12);
      --serif:'Lora',Georgia,serif;
      --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
      --mono:'JetBrains Mono',Consolas,Monaco,monospace;
      /* Desktop: el grid ocupa ~85% del viewport.
         Fórmula: container = 31*cell + 30*gap + 2*padding = 85vw
                  → cell = (85vw - 60px - 28px) / 31 */
      --cell: clamp(24px, calc((85vw - 88px) / 31), 48px);
      --gap:2px;
    }
    @media (max-width:720px){ :root{ --cell:36px; --gap:3px; } }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh;}

    /* HEADER — mismo patrón que hacienda-feria.html, en dark */
    .cf-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;}
    .cf-logo{width:34px;height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#0f172a;font-family:var(--serif);font-weight:700;font-size:12px;letter-spacing:.5px;flex-shrink:0;}
    .cf-title-wrap{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
    .cf-title{font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:1.2px;color:var(--text);line-height:1;}
    .cf-sub{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
    .cf-badge{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:1.5px;padding:4px 10px;border-radius:4px;border:1px solid var(--teal);background:var(--teal-soft);color:var(--teal);text-transform:uppercase;flex-shrink:0;}
    .cf-upd{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.5px;white-space:nowrap;}
    .cf-back{padding:8px 12px;background:transparent;border:1px solid var(--border-strong);color:var(--text-2);border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
    .cf-back:hover{border-color:var(--teal);color:var(--teal);}
    @media (max-width:560px){ .cf-upd{display:none;} .cf-badge{display:none;} }

    /* LEYENDA */
    .cf-legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;align-items:center;}
    .cf-legend-item{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);}
    .cf-legend-sw{width:14px;height:14px;border-radius:3px;border:1px solid;flex-shrink:0;}
    .sw-vacio{background:#1e293b;border-color:#334155;}
    .sw-extra{background:#064e3b;border-color:#10b981;}
    .sw-mixto{background:#78350f;border-color:#f59e0b;}
    .sw-bal  {background:#7f1d1d;border-color:#ef4444;}

    /* CROQUIS WRAP — ocupa todo el viewport menos header+leyenda, grid centrado */
    .croquis-scroll{
      overflow:auto;
      padding:20px;
      width:100%;
      min-height:calc(100vh - 92px); /* header ~58px + legend ~34px */
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }
    .croquis{
      display:grid;
      grid-template-columns: repeat(31, var(--cell));
      grid-template-rows: repeat(80, var(--cell));
      gap: var(--gap);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      width: max-content;
      flex-shrink: 0;
    }
    @media (max-width:720px){
      .croquis-scroll{padding:12px;justify-content:flex-start;min-height:auto;}
    }

    /* CORRAL CELL */
    .corral{
      border-radius:4px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:var(--mono);font-weight:600;line-height:1.05;
      cursor:pointer;
      border:1px solid;
      padding:1px;
      transition:transform 100ms,box-shadow 150ms,filter 150ms;
      user-select:none;
      text-align:center;
      overflow:hidden;
    }
    .corral:hover{transform:scale(1.15);box-shadow:0 4px 14px rgba(20,184,166,0.35);z-index:5;filter:brightness(1.15);}
    .corral.vacio    {background:#1e293b;color:#64748b;border-color:#334155;cursor:default;}
    .corral.vacio:hover{transform:none;box-shadow:none;filter:none;}
    .corral.extra    {background:#064e3b;color:#6ee7b7;border-color:#10b981;}
    .corral.mixto    {background:#78350f;color:#fcd34d;border-color:#f59e0b;}
    .corral.balanza  {background:#7f1d1d;color:#fca5a5;border-color:#ef4444;cursor:default;letter-spacing:.3px;}
    .corral.balanza:hover{transform:none;box-shadow:none;filter:none;}
    .corral-label{font-weight:700;font-size:10px;}
    .corral-cab{font-size:8px;font-weight:500;opacity:.85;margin-top:1px;}
    @media (max-width:720px){
      .corral-label{font-size:13px;}
      .corral-cab{font-size:10px;margin-top:2px;}
    }

    /* MODAL — dark */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:24px;}
    .modal-bg.show{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:8px;padding:20px 22px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.4);}
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;}
    .modal-corral{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--text);line-height:1;}
    .modal-corral-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:6px;}
    .modal-close{background:transparent;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1;padding:0 4px;}
    .modal-close:hover{color:var(--text);}
    .tropa-card{background:#0b1220;border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:8px;}
    .tropa-card:last-of-type{margin-bottom:16px;}
    .tropa-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;font-size:13px;}
    .tropa-row:last-child{margin-bottom:0;}
    .tropa-lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;flex-shrink:0;}
    .tropa-val{font-family:var(--sans);color:var(--text);text-align:right;word-break:break-word;}
    .tropa-val.mono{font-family:var(--mono);font-size:11px;color:var(--text-2);}
    .modal-btn{display:block;width:100%;padding:12px 16px;background:var(--teal);color:#0f172a;text-decoration:none;border-radius:6px;font-weight:700;font-size:14px;text-align:center;font-family:var(--sans);border:none;cursor:pointer;transition:filter 120ms;}
    .modal-btn:hover{filter:brightness(1.1);}

    /* ERROR */
    .cf-error{display:none;padding:24px;max-width:520px;margin:24px auto;background:var(--red-soft);border:1px solid var(--red);border-left:3px solid var(--red);border-radius:8px;text-align:center;}
    .cf-error.show{display:block;}
    .cf-error-title{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--red);margin-bottom:8px;}
    .cf-error-msg{font-family:var(--mono);font-size:11px;color:var(--text-2);margin-bottom:14px;word-break:break-word;}
    .cf-error-btn{padding:10px 18px;background:var(--teal);color:#0f172a;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-family:var(--sans);font-size:13px;}

    .cf-loading{padding:48px 24px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;}
  </style>
</head>

ral","label":"116"},{"id":"142","sc":8,"sr":58,"nc":2,"nr":4,"type":"corral","label":"115"},{"id":"143","sc":8,"sr":62,"nc":2,"nr":4,"type":"corral","label":"114"},{"id":"144","sc":8,"sr":66,"nc":2,"nr":4,"type":"corral","label":"113"},{"id":"145","sc":12,"sr":53,"nc":2,"nr":4,"type":"corral","label":"135"},{"id":"146","sc":12,"sr":49,"nc":2,"nr":4,"type":"corral","label":"134"},{"id":"147","sc":12,"sr":45,"nc":2,"nr":4,"type":"corral","label":"133"},{"id":"148","sc":12,"sr":41,"nc":2,"nr":4,"type":"corral","label":"132"},{"id":"149","sc":12,"sr":37,"nc":2,"nr":4,"type":"corral","label":"131"},{"id":"150","sc":12,"sr":33,"nc":2,"nr":4,"type":"corral","label":"130"},{"id":"151","sc":12,"sr":29,"nc":2,"nr":4,"type":"corral","label":"129"},{"id":"152","sc":12,"sr":25,"nc":2,"nr":4,"type":"corral","label":"128"},{"id":"153","sc":12,"sr":21,"nc":2,"nr":4,"type":"corral","label":"127"},{"id":"BAL","sc":12,"sr":14,"nc":4,"nr":6,"type":"special","label":"⚖ BALANZA"}];

let lastDataHash=null, pollHandle=null, firstLoad=true;
let stockByLabel=new Map(); // label → [{tropa, mov}, ...]

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDesde(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

async function fetchData(){
  const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
  const [tR,mR]=await Promise.all([
    fetch(SB_URL+'/rest/v1/tropas?estado=eq.activa&select=*&order=created_at.desc',{headers:h}),
    fetch(SB_URL+'/rest/v1/movimientos_corral?select=*&order=created_at.desc',{headers:h})
  ]);
  if(!tR.ok) throw new Error('tropas HTTP '+tR.status);
  if(!mR.ok) throw new Error('movimientos_corral HTTP '+mR.status);
  return {tropas:await tR.json(),movs:await mR.json()};
}

function computeStock(tropas,movs){
  const ultPorTropa=new Map();
  for(const m of movs) if(!ultPorTropa.has(m.tropa_id)) ultPorTropa.set(m.tropa_id,m);
  const byLabel=new Map();
  for(const t of tropas){
    const m=ultPorTropa.get(t.id);
    const corral=m?m.corral_destino:null;
    if(!corral) continue;
    if(!byLabel.has(corral)) byLabel.set(corral,[]);
    byLabel.get(corral).push({tropa:t,mov:m});
  }
  return byLabel;
}

function corralState(entries){
  if(!entries||entries.length===0) return 'vacio';
  let hasRemate=false, hasExtra=false;
  for(const e of entries){
    if(e.tropa.tipo_origen==='remate') hasRemate=true;
    else hasExtra=true;
  }
  if(hasRemate) return 'mixto'; // sólo-remate o mezcla → amarillo
  return 'extra';
}

function renderGrid(){
  const root=document.getElementById('croquis');
  const frag=document.createDocumentFragment();
  for(const it of LAYOUT){
    const div=document.createElement('div');
    div.style.gridColumn = it.sc+' / span '+it.nc;
    div.style.gridRow    = it.sr+' / span '+it.nr;
    if(it.type==='special' && it.id==='BAL'){
      div.className='corral balanza';
      div.innerHTML='<span class="corral-label">⚖</span><span class="corral-cab">BALANZA</span>';
      frag.appendChild(div);
      continue;
    }
    const entries=stockByLabel.get(it.label)||[];
    const state=corralState(entries);
    div.className='corral '+state;
    div.dataset.label=it.label;
    const totalCab=entries.reduce((s,e)=>s+(parseInt(e.mov?e.mov.cabezas:e.tropa.cabezas_inicial,10)||0),0);
    const cabText=entries.length===0?'':(totalCab+' cab');
    div.innerHTML='<span class="corral-label">'+esc(it.label)+'</span>'+(cabText?'<span class="corral-cab">'+esc(cabText)+'</span>':'');
    if(entries.length>0) div.addEventListener('click',()=>openModal(it.label));
    frag.appendChild(div);
  }
  root.innerHTML='';
  root.appendChild(frag);
}

function openModal(label){
  const entries=stockByLabel.get(label)||[];
  const head='<div class="modal-head">'
    +'<div><div class="modal-corral">Corral '+esc(label)+'</div>'
    +'<div class="modal-corral-sub">'+entries.length+' tropa'+(entries.length===1?'':'s')+' · '+entries.reduce((s,e)=>s+(parseInt(e.mov?e.mov.cabezas:e.tropa.cabezas_inicial,10)||0),0)+' cabezas</div></div>'
    +'<button class="modal-close" onclick="closeModal()">×</button>'
    +'</div>';
  const cards=entries.map(e=>{
    const t=e.tropa, m=e.mov;
    const cab=m?m.cabezas:t.cabezas_inicial;
    const desde=m?m.created_at:t.created_at;
    return '<div class="tropa-card">'
      +'<div class="tropa-row"><span class="tropa-lbl">Empresa</span><span class="tropa-val">'+esc(t.empresa||t.propietario||'—')+'</span></div>'
      +'<div class="tropa-row"><span class="tropa-lbl">Categoría</span><span class="tropa-val">'+esc(t.categoria||'—')+' · '+esc(cab)+' cab</span></div>'
      +'<div class="tropa-row"><span class="tropa-lbl">Desde</span><span class="tropa-val mono">'+esc(fmtDesde(desde))+'</span></div>'
      +'<div class="tropa-row"><span class="tropa-lbl">Tropa</span><span class="tropa-val mono">'+esc(t.codigo_tropa||'—')+'</span></div>'
      +(t.tipo_origen==='remate'?'<div class="tropa-row"><span class="tropa-lbl">Origen</span><span class="tropa-val">Remate '+esc(t.remate_codigo||'')+'</span></div>':'')
      +'</div>';
  }).join('');
  const btn='<a href="hacienda-feria.html?corral='+encodeURIComponent(label)+'" target="_blank" rel="noopener" class="modal-btn">+ Registrar movimiento</a>';
  document.getElementById('modal-content').innerHTML=head+cards+btn;
  document.getElementById('modal-bg').classList.add('show');
}

function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }
document.getElementById('modal-bg').addEventListener('click',e=>{
  if(e.target.id==='modal-bg') closeModal();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function hashData(d){
  try{
    return JSON.stringify({
      t:d.tropas.map(x=>x.id+':'+x.estado+':'+x.empresa+':'+x.categoria),
      m:d.movs.map(x=>x.id+':'+x.tropa_id+':'+x.corral_destino+':'+x.cabezas)
    });
  }catch(_){return Math.random().toString();}
}

function setUpd(){
  document.getElementById('upd').textContent=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function load(showLoading){
  if(showLoading){
    document.getElementById('cf-loading').style.display='block';
    document.getElementById('croquis-scroll').style.display='none';
    document.getElementById('cf-error').classList.remove('show');
  }
  try{
    const data=await fetchData();
    const h=hashData(data);
    setUpd();
    if(h===lastDataHash && !showLoading){
      return; // sin cambios, no redibujar
    }
    lastDataHash=h;
    stockByLabel=computeStock(data.tropas,data.movs);
    renderGrid();
    document.getElementById('cf-loading').style.display='none';
    document.getElementById('croquis-scroll').style.display='block';
    document.getElementById('cf-error').classList.remove('show');
    firstLoad=false;
  }catch(e){
    console.error('Croquis load error:',e);
    if(firstLoad){
      document.getElementById('cf-loading').style.display='none';
      document.getElementById('cf-error-msg').textContent=e.message||'desconocido';
      document.getElementById('cf-error').classList.add('show');
    }
  }
}

document.getElementById('cf-retry').onclick=()=>load(true);

// Polling
function startPolling(){ if(!pollHandle) pollHandle=setInterval(()=>load(false),30000); }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(pollHandle){clearInterval(pollHandle);pollHandle=null;} }
  else { load(false); startPolling(); }
});

load(true);
startPolling();
</script>
